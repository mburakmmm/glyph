name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.0.1-audit)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NOX_VERSION: "v2.2.38"

jobs:
  verify:
    name: Pre-Release Verification Gate
    uses: ./.github/workflows/ci.yml

  package-and-release:
    name: Package, Attest & Publish Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE '(-|^v0\.)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install NOX toolchain
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Pin NOX version
        run: |
          CURRENT=$(noxc --version)
          EXPECTED="noxc ${NOX_VERSION#v}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            noxc upgrade "$NOX_VERSION"
          fi
          noxc --version

      - name: Install Zig 0.16.0 (required for wasm32-freestanding)
        run: |
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build release artifacts & CycloneDX SBOM
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          noxc sbom . -o "dist/glyph-${TAG}.sbom.json"
          noxc build --target wasm32-freestanding -o "dist/glyph-${TAG}-wasm32-freestanding.wasm" glyph/api.nox
          git archive --format=tar.gz --prefix="glyph-${TAG}/" -o "dist/glyph-${TAG}-src.tar.gz" HEAD
          git archive --format=zip --prefix="glyph-${TAG}/" -o "dist/glyph-${TAG}-src.zip" HEAD
          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Generate build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/glyph-*.tar.gz
            dist/glyph-*.zip
            dist/glyph-*.sbom.json
            dist/glyph-*.wasm

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Glyph ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/glyph-*.tar.gz
            dist/glyph-*.zip
            dist/glyph-*.sbom.json
            dist/glyph-*.wasm
            dist/SHA256SUMS.txt
