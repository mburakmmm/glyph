name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOX_VERSION: "v2.1.186"

jobs:
  policy-and-boundaries:
    name: Manifest & Dependency Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate nox.json manifest
        run: python3 -m json.tool nox.json > /dev/null

      - name: Enforce core dependency isolation (AGENTS.md §2.18 & ADR-0001)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          core_dir = pathlib.Path("glyph")
          if not core_dir.is_dir():
              print("ERROR: glyph/ directory missing", file=sys.stderr)
              sys.exit(1)

          forbidden_framework = re.compile(r"^\s*(import|from)\s+(integrations|nyx|aether|aura)\b", re.M)
          forbidden_hosted = re.compile(r"^\s*(import|from)\s+(nox\.fs|nox\.unicode)\b", re.M)
          hosted_allowlist = {"loader_fs.nox", "locale.nox"}

          errors = []
          for path in sorted(core_dir.rglob("*.nox")):
              text = path.read_text(encoding="utf-8")
              if forbidden_framework.search(text):
                  errors.append(f"{path}: core module must never import framework/integration modules")
              if path.name not in hosted_allowlist and forbidden_hosted.search(text):
                  errors.append(f"{path}: core module must remain freestanding-safe (no nox.fs / nox.unicode)")

          if errors:
              for err in errors:
                  print("BOUNDARY ERROR:", err, file=sys.stderr)
              sys.exit(1)
          print(f"Verified dependency boundaries across {len(list(core_dir.rglob('*.nox')))} core file(s).")
          PY

  test-matrix:
    name: Check & Test (${{ matrix.label }})
    needs: policy-and-boundaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-latest
          - label: Linux ARM64
            os: ubuntu-24.04-arm
          - label: macOS ARM64
            os: macos-latest
          - label: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NOX toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Install NOX toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
              "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install mingw -y
              $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
              $user = [System.Environment]::GetEnvironmentVariable("Path", "User")
              $env:Path = "$machine;$user"
              $gcc = Get-Command gcc.exe | Select-Object -ExpandProperty Source
              Split-Path $gcc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          irm https://noxlang.com/install.ps1 | iex
          "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pin NOX version
        shell: bash
        run: |
          CURRENT=$(noxc --version)
          EXPECTED="noxc ${NOX_VERSION#v}"
          echo "Installed: $CURRENT (expected: $EXPECTED)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            noxc upgrade "$NOX_VERSION"
          fi
          noxc --version

      - name: Check core modules (LLVM, QBE, freestanding, spawn lint)
        shell: bash
        run: |
          for f in glyph/*.nox integrations/*/*.nox cli/*.nox; do
            echo "Checking $f"
            noxc check "$f"
            noxc check --backend qbe "$f"
            noxc check --strict-spawn-shared "$f"
          done
          noxc check --profile freestanding glyph/api.nox

      - name: Build and smoke-test glyph CLI binary
        shell: bash
        run: |
          mkdir -p dist
          BIN_EXT=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            BIN_EXT=".exe"
          fi
          noxc build -o "dist/glyph-cli${BIN_EXT}" cli/main.nox
          "./dist/glyph-cli${BIN_EXT}" version --format json
          rm -rf dist

      - name: Run NOX test suite
        shell: bash
        run: |
          if ! noxc test; then
            echo "::group::Re-running test files individually for failure diagnostics"
            for t in tests/*/*_test.nox; do
              echo "==> Checking $t"
              if noxc build -o /tmp/diag_test_bin "$t"; then
                set +e
                /tmp/diag_test_bin
                rc=$?
                set -e
                if [ "$rc" -ne 0 ]; then
                  echo "FAILED binary: $t (rc=$rc)"
                fi
              else
                echo "FAILED compile: $t"
              fi
            done
            rm -f /tmp/diag_test_bin
            echo "::endgroup::"
            exit 1
          fi

      - name: Check and run examples
        shell: bash
        run: |
          for ex in examples/*/main.nox; do
            echo "Running example: $ex"
            noxc check "$ex"
            noxc run "$ex"
          done

  wasm-and-supply-chain:
    name: WASM Smoke & SBOM
    needs: policy-and-boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NOX toolchain
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Pin NOX version
        run: |
          CURRENT=$(noxc --version)
          EXPECTED="noxc ${NOX_VERSION#v}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            noxc upgrade "$NOX_VERSION"
          fi
          noxc --version

      - name: Install Zig 0.16.0 (required for wasm32-freestanding)
        run: |
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build wasm32-freestanding smoke targets
        run: |
          mkdir -p dist
          noxc build --target wasm32-freestanding -o dist/glyph_api.wasm glyph/api.nox
          noxc build --target wasm32-freestanding -o dist/audit_consumer.wasm examples/audit_consumer/main.nox
          ls -lh dist/*.wasm

      - name: Verify SBOM & lock signature check
        run: |
          mkdir -p dist
          noxc sbom . -o dist/glyph.sbom.json
          python3 -m json.tool dist/glyph.sbom.json > /dev/null
          noxc sign check .
