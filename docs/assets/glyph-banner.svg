    <path d="M46 44 C38 44 35 48 35 55 V60 C35 64 32 66 28 66 C32 66 35 68 35 72 V77 C35 84 38 88 46 88" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M82 44 C90 44 93 48 93 55 V60 C93 64 96 66 100 66 C96 66 93 68 93 72 V77 C93 84 90 88 82 88" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
